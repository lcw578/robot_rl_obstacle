# STEP 夹剪已转换到 wrist3_Link 坐标，固定安装，不再重复旋转。
# 网格的安装方向参考同项目组公开 MJCF；实机仍需核对安装及 TCP。
# 质量和惯量由参考 MJCF 定义。
# TCP原点在wrist3_Link（末端法兰参考系）中的坐标，单位m；不是世界坐标。
# 2026-11-19用户最新指定：沿法兰局部+Z方向120mm；上一轮150mm实验保留。
# 仅改变工作点/控制参考，不移动或缩短夹剪CAD；有效夹剪位置仍需实物/仿真核对。
tcp_position: [0.0, 0.0, 0.120]

# 工具坐标系 H 相对法兰 F 的方向；MuJoCo 四元数顺序为 [w,x,y,z]。
# 绕法兰 +Z 轴转 -90°：X_H=-Y_F，Y_H=+X_F，Z_H=+Z_F。
# 当前初始姿态（6个关节角都为0）下：
#   红色 +X_H = 世界 -Z（竖直向下）
#   蓝色 +Z_H = 世界 -Y（由法兰朝夹爪前方水平伸出）
#   绿色 +Y_H = 世界 +X（由右手规则确定）
# 这是固定在工具上的局部坐标系；机械臂运动后，它会随工具转动。
# 修改本项会同步改变末端观测/控制所用的坐标系，而不只是改显示颜色。
tcp_quaternion: [0.7071067811865476, 0.0, 0.0, -0.7071067811865476]
